<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Etnias</title>
<style>
:root{color-scheme:light dark;--ink:#182c34;--paper:#f5f5f1;--red:#bd171c}
@media (prefers-color-scheme:dark){:root{--ink:#eef3f2;--paper:#101c20}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
img{width:96px;height:96px;border-radius:24px}
h1{font-size:22px;margin:16px 0 8px}
p{margin:0 0 24px;max-width:320px}
button{min-height:48px;padding:0 28px;border:0;border-radius:999px;background:var(--red);color:#fff;font:700 16px system-ui,sans-serif}
</style>
</head>
<body>
<main>
<img src="icon.png" alt="">
<h1>Sem conexão</h1>
<p>Não foi possível chegar ao Etnias. Confira a internet do aparelho e tente de novo.</p>
<button type="button" id="retry">Tentar de novo</button>
</main>
<script src="offline.js"></script>
</body>
</html>
