# coturn para as chamadas da Casa Opy. Segredo, IP público e realm entram pela linha de comando (compose.yaml).
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49260
fingerprint
use-auth-secret
stale-nonce=600
# Ajuste o caminho do certificado ao subdomínio do TURN (Let's Encrypt).
cert=/etc/letsencrypt/live/turn/fullchain.pem
pkey=/etc/letsencrypt/live/turn/privkey.pem
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Limites para não esgotar a banda da VPS.
user-quota=12
total-quota=300
# Impede que o TURN seja usado para alcançar a rede interna da VPS.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=stdout
simple-log
