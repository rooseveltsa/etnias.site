name: casa-opy
services:
  opy:
    build:
      context: ../..
      dockerfile: deploy/opy/Dockerfile
    image: casa-opy:local
    restart: unless-stopped
    ports:
      # Só o proxy HTTPS do host acessa. Câmera e microfone exigem HTTPS no navegador.
      - "127.0.0.1:${OPY_HTTP_PORT:-8101}:8101"
    environment:
      OPY_SESSION_SECRET: ${OPY_SESSION_SECRET:?Configure deploy/opy/.env}
      OPY_TURN_URLS: ${OPY_TURN_URLS:-}
      OPY_STUN_URLS: ${OPY_STUN_URLS:-}
      OPY_TURN_SECRET: ${OPY_TURN_SECRET:-}
      # Usuários com papel de administração definido no servidor (separados por vírgula). Moderadores são nomeados pelo painel.
      OPY_ADMIN_USERNAMES: ${OPY_ADMIN_USERNAMES:-}
      # Web Push (Fase 3): sem as chaves o recurso fica oculto. Gerar com `npx web-push generate-vapid-keys`.
      OPY_VAPID_PUBLIC_KEY: ${OPY_VAPID_PUBLIC_KEY:-}
      OPY_VAPID_PRIVATE_KEY: ${OPY_VAPID_PRIVATE_KEY:-}
      OPY_VAPID_SUBJECT: ${OPY_VAPID_SUBJECT:-https://etnias.site}
      # Live (Fase 4): sinalização WHIP/WHEP vai por proxy ao MediaMTX; gravações ficam no volume compartilhado.
      OPY_LIVE_URL: http://live:8889
      OPY_LIVE_RECORDINGS_DIR: /recordings
    volumes:
      - opy-data:/data
      - live-recordings:/recordings:ro
  live:
    # Servidor de vídeo ao vivo (WebRTC). Só a porta de mídia é pública; a sinalização entra pelo app. Config: mediamtx.yml.
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${OPY_PUBLIC_IP:?Configure deploy/opy/.env}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - live-recordings:/recordings
  turn:
    # TURN/STUN próprio para as chamadas atravessarem redes móveis (CGNAT). Rede do host: o TURN precisa do IP público e da faixa UDP.
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ${OPY_TURN_CERT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${OPY_TURN_SECRET:?Configure deploy/opy/.env}", "--external-ip=${OPY_PUBLIC_IP:?Configure deploy/opy/.env}", "--realm=${OPY_TURN_REALM:?Configure deploy/opy/.env}"]
volumes:
  opy-data:
  live-recordings:
