ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
    <FilesMatch "(?i)(^\.|\.(sql|bak|log|ini|env)$|^(config\.php|_diag\.php|system_status\.php|updater\.php|error_log)$)">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "(?i)^/[^/]+\.zip$">
    Require all denied
</LocationMatch>
<Directory /var/www/html/upload>
    AllowOverride None
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
